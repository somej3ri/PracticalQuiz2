<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practical Quiz 2 – Hut in an Open Field (A-Frame, no models)</title>
<script src="aframe.js"></script>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script>
/* ============ HELPERS (units: metres, +Y up, camera looks toward -Z) ============ */
// Add a child primitive with the given attributes.
function part(parent, tag, attrs) {
  const el = document.createElement(tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  parent.appendChild(el);
  return el;
}
// Small seeded random generator so the field looks the same on every load.
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ============ DIRT PATH DATA: [x, z] points; trails start just outside the 3.6 m deck ============ */
const PATH_W = 1.6;
const PATHS = [
  [[0, 1.8], [0, 5], [0.5, 8], [3, 14], [2, 22], [-1, 32], [-3, 45]],   // front trail toward the camera side
  [[1.8, 0], [5, 0], [7, -1], [11, -4], [12, -10]]                      // side trail winding between the trees
];
function onPath(x, z) {            // true if (x,z) is on a trail (+0.15 m margin so grass doesn't touch it)
  for (const p of PATHS) for (let i = 0; i < p.length - 1; i++) {
    const ax = p[i][0], az = p[i][1], dx = p[i + 1][0] - ax, dz = p[i + 1][1] - az;
    const t = Math.max(0, Math.min(1, ((x - ax) * dx + (z - az) * dz) / (dx * dx + dz * dz)));
    if (Math.hypot(x - (ax + t * dx), z - (az + t * dz)) < PATH_W / 2 + 0.15) return true;
  } return false;
}

/* ============ SKY: vertical gradient shader ============ */
AFRAME.registerShader('skygrad', {
  schema: { top: { type: 'color', default: '#4a90d9', is: 'uniform' },
            bottom: { type: 'color', default: '#cfe6f5', is: 'uniform' } },
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 bottom; varying vec3 vP; void main(){ float h = clamp(vP.y,0.0,1.0); gl_FragColor = vec4(mix(bottom, top, pow(h,0.6)), 1.0); }'
});

/* ============ CHAIR (matte, no glow). Faces +Z at rotation 0; backrest on -Z side ============ */
AFRAME.registerComponent('chair', {
  init: function () {
    const el = this.el, mat = 'color: #8d5a2b; roughness: 0.85';
    part(el, 'a-box', { position: '0 0.45 0', width: 0.42, height: 0.04, depth: 0.42, material: mat, shadow: 'cast: true; receive: true' });
    [[-0.19, -0.19], [0.19, -0.19], [-0.19, 0.19], [0.19, 0.19]].forEach(p =>
      part(el, 'a-cylinder', { position: p[0] + ' 0.215 ' + p[1], radius: 0.02, height: 0.43, material: mat, shadow: 'cast: true' }));
    part(el, 'a-box', { position: '0 0.72 -0.2', width: 0.42, height: 0.5, depth: 0.03, material: mat, shadow: 'cast: true; receive: true' });
  }
});

/* ---- Label artwork, drawn on a canvas and wrapped around the tin (front = canvas centre) ---- */
function ribs(g, W, H) {                       // faint horizontal ribs like a real tin
  for (let y = H * 0.12; y < H * 0.9; y += H * 0.07) {
    g.lineWidth = 3; g.strokeStyle = 'rgba(0,0,0,0.10)'; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,0.10)'; g.beginPath(); g.moveTo(0, y + 4); g.lineTo(W, y + 4); g.stroke();
  }
}
function footballer(g, x, y, s) {              // simple stylised kicking player
  g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#8bd06f';
  g.lineWidth = 26 * s; g.beginPath(); g.moveTo(x, y + 40 * s); g.lineTo(x + 70 * s, y + 95 * s); g.lineTo(x + 150 * s, y + 75 * s); g.stroke();
  g.beginPath(); g.moveTo(x, y + 40 * s); g.lineTo(x - 40 * s, y + 110 * s); g.lineTo(x - 55 * s, y + 170 * s); g.stroke();
  g.lineWidth = 46 * s; g.beginPath(); g.moveTo(x - 5 * s, y - 30 * s); g.lineTo(x, y + 35 * s); g.stroke();
  g.strokeStyle = '#5e3b2c'; g.lineWidth = 16 * s;
  g.beginPath(); g.moveTo(x - 10 * s, y - 40 * s); g.lineTo(x - 80 * s, y - 70 * s); g.stroke();
  g.beginPath(); g.moveTo(x + 10 * s, y - 40 * s); g.lineTo(x + 70 * s, y - 95 * s); g.stroke();
  g.fillStyle = '#5e3b2c'; g.beginPath(); g.arc(x, y - 75 * s, 22 * s, 0, 6.283); g.fill();
  g.fillStyle = '#f4f4f4'; g.beginPath(); g.arc(x + 175 * s, y + 60 * s, 22 * s, 0, 6.283); g.fill();
}
function drawMilo(g, W, H) {                   // green tin, white/gold badge, brown MILO letters
  const k = H / 770, cx = W / 2, by = H * 0.34;
  g.fillStyle = '#1e9239'; g.fillRect(0, 0, W, H); ribs(g, W, H);
  g.fillStyle = '#cdd3d6'; g.fillRect(0, 0, W, H * 0.05); g.fillRect(0, H * 0.955, W, H * 0.045);   // silver rims
  g.strokeStyle = '#d9a521'; g.lineWidth = 14 * k; g.beginPath(); g.ellipse(cx - 12 * k, by + 10 * k, 285 * k, 128 * k, -0.06, 0, 6.283); g.stroke();
  g.fillStyle = '#f3f6f8'; g.beginPath(); g.ellipse(cx, by, 272 * k, 118 * k, -0.06, 0, 6.283); g.fill();
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#e2231a'; g.font = 'italic bold ' + 58 * k + 'px Georgia, serif'; g.fillText('Nestlé', cx + 110 * k, by - 78 * k);
  g.font = 'italic 900 ' + 150 * k + 'px "Arial Black", Impact, sans-serif';
  g.fillStyle = '#d9a521'; g.fillText('MILO', cx + 5 * k, by + 28 * k); g.fillStyle = '#6b1f1a'; g.fillText('MILO', cx, by + 22 * k);
  g.fillStyle = '#e2231a'; g.beginPath(); g.ellipse(cx + 235 * k, by + 150 * k, 78 * k, 26 * k, -0.1, 0, 6.283); g.fill();
  g.fillStyle = '#ffd24a'; g.font = 'italic bold ' + 26 * k + 'px Arial'; g.fillText('Activ-Go', cx + 235 * k, by + 150 * k);
  footballer(g, cx - 10 * k, H * 0.68, k);
  g.textAlign = 'left'; g.fillStyle = '#ffffff'; g.font = 'bold ' + 27 * k + 'px Arial';
  ['THE ENERGY', 'FOOD DRINK'].forEach((t, i) => g.fillText(t, cx - 300 * k, H * 0.585 + i * 30 * k));
  g.font = 'bold ' + 21 * k + 'px Arial';
  ['LA BOISSON NUTRITIVE', 'ET ÉNERGÉTIQUE'].forEach((t, i) => g.fillText(t, cx - 300 * k, H * 0.675 + i * 26 * k));
  g.fillStyle = '#6e2a24'; g.fillRect(cx - 310 * k, H * 0.83, 440 * k, H * 0.105);              // nutrition strip
  g.fillStyle = '#fff'; for (let i = 0; i < 5; i++) { g.beginPath(); g.arc(cx - 265 * k + i * 82 * k, H * 0.882, 27 * k, 0, 6.283); g.fill(); }
  g.fillStyle = '#d8a84a'; g.fillRect(cx + 130 * k, H * 0.83, 70 * k, H * 0.105);               // "Find out more" tab
  g.fillStyle = '#b5683a'; g.beginPath(); g.ellipse(cx + 285 * k, H * 0.74, 34 * k, 46 * k, 0.3, 0, 6.283); g.fill();   // chocolate swirl
  g.textAlign = 'center'; g.fillStyle = '#fff'; g.font = 'bold ' + 20 * k + 'px Arial'; g.fillText('Net weight', cx + 255 * k, H * 0.80);
  g.font = 'bold ' + 50 * k + 'px Arial'; g.fillText('400g', cx + 255 * k, H * 0.87);
}
function drawNido(g, W, H) {                   // yellow tin, heart outline, green NIDO, red arrow, milk glass
  const k = H / 885, cx = W / 2, hy = H * 0.29;
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, '#f7c800'); gr.addColorStop(0.72, '#f3b300'); gr.addColorStop(0.88, '#e8601c'); gr.addColorStop(1, '#cf2027');
  g.fillStyle = gr; g.fillRect(0, 0, W, H); ribs(g, W, H);
  g.fillStyle = '#d5d8da'; g.fillRect(0, 0, W, H * 0.04);
  g.strokeStyle = '#fbe58a'; g.lineWidth = 16 * k; g.lineJoin = 'round'; g.beginPath();           // heart outline
  g.moveTo(cx, hy + 190 * k); g.bezierCurveTo(cx - 400 * k, hy - 20 * k, cx - 240 * k, hy - 280 * k, cx, hy - 90 * k);
  g.bezierCurveTo(cx + 240 * k, hy - 280 * k, cx + 400 * k, hy - 20 * k, cx, hy + 190 * k); g.stroke();
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#1f6e35'; g.font = 'italic bold ' + 44 * k + 'px Georgia, serif'; g.fillText('Nestlé', cx - 120 * k, hy - 95 * k);
  g.font = 'bold ' + 165 * k + 'px Georgia, serif'; g.strokeStyle = '#14502a'; g.lineWidth = 6 * k; g.fillStyle = '#1f7a3a';
  g.strokeText('NIDO', cx, hy + 10 * k); g.fillText('NIDO', cx, hy + 10 * k);
  g.fillStyle = '#d3262b'; g.font = 'bold ' + 40 * k + 'px Arial'; g.fillText('FORTIFIED', cx - 40 * k, hy + 120 * k);
  const ax = cx - 215 * k, ay = H * 0.66;                                                          // red FortiGrow arrow
  g.fillStyle = '#d3262b'; g.beginPath(); g.moveTo(ax, ay - 150 * k); g.lineTo(ax + 90 * k, ay - 50 * k); g.lineTo(ax + 45 * k, ay - 50 * k);
  g.lineTo(ax + 45 * k, ay + 110 * k); g.lineTo(ax - 45 * k, ay + 110 * k); g.lineTo(ax - 45 * k, ay - 50 * k); g.lineTo(ax - 90 * k, ay - 50 * k); g.closePath(); g.fill();
  g.fillStyle = '#fff'; g.font = 'italic bold ' + 24 * k + 'px Arial'; g.fillText('FortiGrow', ax, ay - 70 * k);
  g.fillStyle = '#fff'; g.fillRect(cx - 120 * k, ay + 20 * k, 120 * k, 36 * k);
  g.fillStyle = '#1b64b5'; g.font = 'bold ' + 14 * k + 'px Arial'; g.fillText('High Quality Proteins', cx - 60 * k, ay + 38 * k);
  const gx = cx + 120 * k, gy = H * 0.64;                                                          // milk glass + splash
  g.fillStyle = 'rgba(255,255,255,0.93)'; g.beginPath(); g.moveTo(gx - 110 * k, gy - 110 * k); g.lineTo(gx + 110 * k, gy - 110 * k);
  g.lineTo(gx + 85 * k, gy + 170 * k); g.lineTo(gx - 85 * k, gy + 170 * k); g.closePath(); g.fill();
  g.strokeStyle = '#cfe3ee'; g.lineWidth = 6 * k; g.stroke();
  g.fillStyle = '#fff'; [[-70, -130, 26], [-10, -150, 32], [60, -140, 28], [100, -120, 18], [30, -200, 22]]
    .forEach(p => { g.beginPath(); g.arc(gx + p[0] * k, gy + p[1] * k, p[2] * k, 0, 6.283); g.fill(); });
  g.lineCap = 'round'; g.lineWidth = 30 * k; g.strokeStyle = '#fff'; g.beginPath(); g.moveTo(gx + 60 * k, gy - 240 * k); g.quadraticCurveTo(gx + 20 * k, gy - 190 * k, gx - 10 * k, gy - 130 * k); g.stroke();
  g.fillStyle = '#fff7e0'; g.font = 'bold ' + 21 * k + 'px Arial'; g.fillText('Instant Full Cream Milk Powder', cx - 10 * k, H * 0.885);
  g.font = 'bold ' + 24 * k + 'px Arial'; g.fillText('Net weight 2500g', cx + 200 * k, H * 0.935);
}

/* ============ TIN: kind = milo | nido. Cylinder wrapped with the canvas label, plus lid. Origin = base. Static (no rotation). ============ */
AFRAME.registerComponent('tin', {
  schema: { kind: { default: 'milo' }, radius: { default: 0.055 }, height: { default: 0.13 } },
  init: function () {
    const d = this.data, r = d.radius, h = d.height, nido = d.kind === 'nido';
    const W = 2048, H = Math.round(W * h / (2 * Math.PI * r));      // canvas matches the tin's unrolled surface
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    (nido ? drawNido : drawMilo)(cv.getContext('2d'), W, H);
    const tex = new THREE.CanvasTexture(cv);
    tex.wrapS = THREE.RepeatWrapping; tex.offset.x = 0.5;            // puts the canvas centre (front artwork) toward +Z
    tex.anisotropy = 8; if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
    const side = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.45, metalness: 0.1 });
    const cap = new THREE.MeshStandardMaterial({ color: nido ? 0xd9dcde : 0xe9eef0, roughness: 0.5 });
    const body = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 64), [side, cap, cap]);
    body.position.y = h / 2;
    const lid = new THREE.Mesh(new THREE.CylinderGeometry(r + 0.004, r + 0.004, 0.014, 64),
      new THREE.MeshStandardMaterial({ color: 0xf2f5f6, roughness: 0.3, transparent: nido ? false : true, opacity: 0.92 }));
    lid.position.y = h + 0.007;
    [body, lid].forEach(m => { m.castShadow = true; m.receiveShadow = true; });
    this.el.object3D.add(body, lid);
  }
});

/* ============ CUP (origin = base of saucer; handle toward +X) ============ */
AFRAME.registerComponent('cup', {
  schema: { color: { default: '#fafafa' } },
  init: function () {
    const el = this.el, mat = 'color: ' + this.data.color + '; roughness: 0.35; side: double';
    part(el, 'a-cylinder', { position: '0 0.005 0', radius: 0.075, height: 0.01, material: mat, shadow: 'cast: true' });
    part(el, 'a-cylinder', { position: '0 0.05 0', radius: 0.042, height: 0.08, 'open-ended': true, material: mat, shadow: 'cast: true' });
    part(el, 'a-circle', { position: '0 0.085 0', rotation: '-90 0 0', radius: 0.038, material: 'color: #4e2a14' });
    part(el, 'a-torus', { position: '0.048 0.05 0', radius: 0.02, 'radius-tubular': 0.005, material: mat });
  }
});

/* ============ HUT: deck, 4 posts, frame, cross beam, pyramid roof, hanging lamp ============ */
AFRAME.registerComponent('hut', {
  init: function () {
    const el = this.el, wood = 'color: #6b4423; roughness: 0.8', sh = 'cast: true; receive: true';
    part(el, 'a-box', { position: '0 -0.015 0', width: 3.6, height: 0.05, depth: 3.6, material: 'color: #9c7a54; roughness: 0.9', shadow: sh });
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(p =>
      part(el, 'a-cylinder', { position: (p[0] * 1.6) + ' 1.3 ' + (p[1] * 1.6), radius: 0.06, height: 2.6, material: wood, shadow: sh }));
    // Frame beams joining the post tops (y = 2.6)
    [-1.6, 1.6].forEach(z => part(el, 'a-box', { position: '0 2.6 ' + z, width: 3.3, height: 0.1, depth: 0.1, material: wood, shadow: sh }));
    [-1.6, 1.6].forEach(x => part(el, 'a-box', { position: x + ' 2.6 0', width: 0.1, height: 0.1, depth: 3.3, material: wood, shadow: sh }));
    // Cross beam: the lamp's mounting point
    part(el, 'a-box', { position: '0 2.55 0', width: 3.2, height: 0.08, depth: 0.08, material: wood, shadow: sh });
    // Pyramid roof (4-sided cone rotated 45° so its edges line up with the posts)
    part(el, 'a-cone', { position: '0 3.0 0', rotation: '0 45 0', 'radius-bottom': 2.9, 'radius-top': 0, height: 0.8,
      'segments-radial': 4, material: 'color: #8a4b2a; roughness: 0.8', shadow: sh });
    // Hanging lamp: cord from the cross beam (y 2.55) down to the shade (y 1.75)
    part(el, 'a-cylinder', { position: '0 2.175 0', radius: 0.005, height: 0.75, color: '#333' });
    part(el, 'a-cylinder', { position: '0 1.75 0', radius: 0.25, height: 0.15, 'open-ended': true, material: 'color: #f4c542; side: double; roughness: 0.7' });
    part(el, 'a-cylinder', { position: '0 1.78 0', radius: 0.02, height: 0.08, material: 'color: #444; roughness: 0.6' });   // socket
    part(el, 'a-sphere', { position: '0 1.7 0', radius: 0.07, material: 'shader: flat; color: #fff3c4' });                    // bulb
    part(el, 'a-entity', { position: '0 1.68 0', light: 'type: point; color: #ffd9a0; intensity: 0.3; distance: 4' });
  }
});

/* ============ GRASS: GPU-instanced blades (2 draw-call-free instances in one mesh) ============ */
AFRAME.registerComponent('grass', {
  init: function () {
    const rnd = rng(7), geo = new THREE.ConeGeometry(0.022, 0.2, 3); geo.translate(0, 0.1, 0);   // shorter, finer blade
    const N1 = 8000, N2 = 2000;                                   // dense zone, medium zone
    const mesh = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({ color: 0xffffff }), N1 + N2);
    const d = new THREE.Object3D(), c = new THREE.Color(), a = new THREE.Color('#3f7d2e'), b = new THREE.Color('#7fb04a');
    let i = 0;
    const scatter = (n, r0, r1, w, h) => {
      for (let k = 0; k < n;) {
        const r = Math.sqrt(r0 * r0 + rnd() * (r1 * r1 - r0 * r0)), t = rnd() * 6.283, x = Math.cos(t) * r, z = Math.sin(t) * r;
        if ((Math.abs(x) < 2.1 && Math.abs(z) < 2.1) || onPath(x, z)) continue;      // keep the hut deck clear
        k++;
        d.position.set(x, 0, z);
        d.rotation.set((rnd() - 0.5) * 0.12, rnd() * 6.283, (rnd() - 0.5) * 0.12);   // less tilt = tidier
        const s = 0.85 + rnd() * 0.3;   // narrower height range d.scale.set(w, h * s, w); d.updateMatrix();
        mesh.setMatrixAt(i, d.matrix); mesh.setColorAt(i++, c.copy(a).lerp(b, rnd()));
      }
    };
    scatter(N1, 0, 8, 1, 1);        // dense: about 40 blades per m² within 8 m
    scatter(N2, 8, 25, 2, 1.2);     // sparse, bigger tufts from 8 to 25 m
    mesh.frustumCulled = false;
    this.el.setObject3D('mesh', mesh);
  }
});

/* ============ DIRT PATHS: flat strips with a canvas-generated speckled dirt texture (no image files) ============ */
AFRAME.registerComponent('dirt-paths', {
  init: function () {
    const cv = document.createElement('canvas'); cv.width = cv.height = 128;
    const g = cv.getContext('2d'), r = rng(3);
    g.fillStyle = '#8b6b47'; g.fillRect(0, 0, 128, 128);
    for (let i = 0; i < 600; i++) { g.fillStyle = r() < 0.5 ? '#a3815a' : '#6f5238'; g.fillRect(r() * 128, r() * 128, 2, 2); }
    const tex = new THREE.CanvasTexture(cv); tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
    const group = new THREE.Group(), Y = 0.01;                      // just above the ground to avoid z-fighting
    const mk = (geo, rx, rz) => { const t = tex.clone(); t.needsUpdate = true; t.repeat.set(rx, rz);
      const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ map: t })); m.receiveShadow = true; return m; };
    PATHS.forEach(p => p.forEach((pt, i) => {
      if (i > 0) {   // round joints hide corners; none at the start, so the trail meets the deck edge cleanly
        const joint = mk(new THREE.CircleGeometry(PATH_W / 2, 16).rotateX(-Math.PI / 2), 1, 1);
        joint.position.set(pt[0], Y, pt[1]); group.add(joint);
      }
      if (i === p.length - 1) return;
      const dx = p[i + 1][0] - pt[0], dz = p[i + 1][1] - pt[1], len = Math.hypot(dx, dz);
      const seg = mk(new THREE.PlaneGeometry(PATH_W, len).rotateX(-Math.PI / 2), PATH_W, len);
      seg.position.set(pt[0] + dx / 2, Y, pt[1] + dz / 2); seg.rotation.y = Math.atan2(dx, dz); group.add(seg);
    }));
    this.el.setObject3D('mesh', group);
  }
});

/* ============ SUN: directional light + visible disc/halo along the same direction ============ */
AFRAME.registerComponent('sun', {
  schema: { dir: { type: 'vec3', default: { x: 6, y: 10, z: 4 } } },
  init: function () {
    const v = new THREE.Vector3(this.data.dir.x, this.data.dir.y, this.data.dir.z).normalize(), el = this.el;
    const at = n => (v.x * n) + ' ' + (v.y * n) + ' ' + (v.z * n);
    part(el, 'a-entity', { position: at(12.3), light: 'type: directional; color: #fff1d6; intensity: 1.1; castShadow: true; ' +
      'shadowMapWidth: 2048; shadowMapHeight: 2048; shadowBias: -0.0005; shadowCameraTop: 5; shadowCameraBottom: -5; ' +
      'shadowCameraLeft: -5; shadowCameraRight: 5; shadowCameraNear: 1; shadowCameraFar: 30' });
    part(el, 'a-sphere', { position: at(300), radius: 14, material: 'shader: flat; color: #fff6c9; fog: false' });
    part(el, 'a-sphere', { position: at(300), radius: 30, material: 'shader: flat; color: #ffe9a8; opacity: 0.25; transparent: true; fog: false' });
  }
});

/* ============ TREE: trunk + 3 low-poly foliage spheres ============ */
AFRAME.registerComponent('tree', {
  schema: { seed: { default: 1 }, size: { default: 1 } },
  init: function () {
    const el = this.el, r = rng(this.data.seed * 101), s = this.data.size, h = (3 + r() * 2) * s;
    const greens = ['#2f7d3a', '#3b8f40', '#4fa04a'];
    part(el, 'a-cylinder', { position: '0 ' + h / 2 + ' 0', radius: (0.25 + r() * 0.15) * s, height: h, material: 'color: #6b4a2b; roughness: 0.9', shadow: 'cast: true' });
    for (let k = 0; k < 3; k++)
      part(el, 'a-sphere', { position: ((r() - 0.5) * s) + ' ' + (h + k * 0.7 * s) + ' ' + ((r() - 0.5) * s),
        radius: (2.2 - k * 0.3) * s, material: 'color: ' + greens[k] + '; flatShading: true; roughness: 1', shadow: 'cast: true' });
  }
});

/* ============ BACKDROP: distant hills and clouds ============ */
AFRAME.registerComponent('backdrop', {
  init: function () {
    const el = this.el, r = rng(42);
    for (let k = 0; k < 6; k++) {                                 // a few low, flat hills at ~55 m (foreground blend)
      const t = k / 6 * 6.283 + r() * 0.5, d = 52 + r() * 6;
      part(el, 'a-sphere', { position: (Math.cos(t) * d) + ' 0 ' + (Math.sin(t) * d), radius: 1,
        scale: (10 + r() * 5) + ' ' + (3 + r() * 2) + ' ' + (10 + r() * 5), material: 'color: #7fa38a; roughness: 1' });
    }
    for (let k = 0; k < 12; k++) {                                // mountain ring at 75-95 m: faceted cones, snow caps on tall ones
      const t = k / 12 * 6.283 + r() * 0.25, d = 75 + r() * 20, R = 9 + r() * 7, H = 12 + r() * 14;
      const x = Math.cos(t) * d, z = Math.sin(t) * d, ry = r() * 60;
      part(el, 'a-cone', { position: x + ' ' + H / 2 + ' ' + z, rotation: '0 ' + ry + ' 0', 'radius-bottom': R, 'radius-top': 0,
        height: H, 'segments-radial': 6, material: 'color: #6f8f86; flatShading: true; roughness: 1' });
      if (H > 18) part(el, 'a-cone', { position: x + ' ' + H * 0.85 + ' ' + z, rotation: '0 ' + ry + ' 0', 'radius-bottom': R * 0.3,
        'radius-top': 0, height: H * 0.3, 'segments-radial': 6, material: 'color: #f2f6f8; flatShading: true; roughness: 1' });
    }
    for (let k = 0; k < 7; k++) {                                 // flattened cloud spheres
      const t = r() * 6.283, d = 40 + r() * 80;
      part(el, 'a-sphere', { position: (Math.cos(t) * d) + ' ' + (38 + r() * 10) + ' ' + (Math.sin(t) * d), radius: 1,
        scale: (8 + r() * 6) + ' 1.5 ' + (4 + r() * 3), material: 'shader: flat; color: #fff; opacity: 0.9; transparent: true; fog: false' });
    }
  }
});
</script>
</head>
<body>
<a-scene shadow="type: pcfsoft" fog="type: exponential; color: #cfe3f5; density: 0.015">

  <!-- ===== SKY, HILLS, CLOUDS ===== -->
  <a-sky radius="400" material="shader: skygrad; side: back"></a-sky>

  <a-entity dirt-paths></a-entity>

  <!-- ===== TREES (7, all 8 m+ from the hut) ===== -->
  <a-entity tree="seed: 1; size: 1.1" position="-9 0 -14"></a-entity>

  <a-entity tree="seed: 7; size: 1.1" position="22 0 -20"></a-entity>

  <!-- ===== HUT: deck, posts, canopy roof, hanging lamp ===== -->
  <a-entity hut></a-entity>
  <a-circle position="0 0.02 0" rotation="-90 0 0" radius="1.1" material="color: #7a9e9f" shadow="receive: true"></a-circle>

  <!-- ===== TABLE (1.2 x 0.8 m, surface at y = 0.78) ===== -->
  <a-box position="0 0.76 0" width="1.2" height="0.04" depth="0.8" material="color: #a0693a; roughness: 0.6" shadow="cast: true; receive: true"></a-box>
  <a-cylinder position="-0.54 0.37 -0.34" radius="0.03" height="0.74" color="#6b4423" shadow="cast: true"></a-cylinder>
  <a-cylinder position="0.54 0.37 -0.34" radius="0.03" height="0.74" color="#6b4423" shadow="cast: true"></a-cylinder>
  <a-cylinder position="-0.54 0.37 0.34" radius="0.03" height="0.74" color="#6b4423" shadow="cast: true"></a-cylinder>
  <a-cylinder position="0.54 0.37 0.34" radius="0.03" height="0.74" color="#6b4423" shadow="cast: true"></a-cylinder>

  <!-- ===== CHAIRS (all face the table) ===== -->
  <a-entity chair position="0 0 -0.75"></a-entity>
  <a-entity chair position="0 0 0.75" rotation="0 180 0"></a-entity>
  <a-entity chair position="-0.95 0 0" rotation="0 90 0"></a-entity>
  <a-entity chair position="0.95 0 0" rotation="0 -90 0"></a-entity>

  <!-- ===== PROPS (tins are static: rotation 0 0 0) ===== -->
  <a-entity tin="kind: milo; radius: 0.055; height: 0.13" position="-0.36 0.78 0.1" rotation="0 0 0"></a-entity>
  <a-entity tin="kind: nido; radius: 0.07; height: 0.19" position="-0.12 0.78 -0.08" rotation="0 0 0"></a-entity>
  <a-entity cup position="0.25 0.78 -0.2"></a-entity>
  <a-entity cup="color: #ffe0b2" position="0.25 0.78 0.2"></a-entity>

  <!-- ===== CAMERA (first person). Cinematic options: wide 6 2.2 8 | close-up 0.9 1.1 1.4 ===== -->
  <a-entity position="0 1.0 3.4">
    <a-camera camera="userHeight: 0; near: 0.1; far: 1000" position="0 0 0" look-controls wasd-controls="acceleration: 20"></a-camera>
  </a-entity>
</a-scene>
